<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--bg:#0d1117;--p:#161b22;--p2:#1f2630;--bd:#2b3340;--tx:#e6edf3;--mu:#8b949e;--ac:#58a6ff;--rd:#f85149;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}

.panel{display:none;flex-direction:column;min-height:0;min-width:0}.panel.on{display:flex}
button{font:inherit;cursor:pointer}
.tb{display:flex;gap:6px;padding:8px;flex-wrap:wrap;border-bottom:1px solid var(--bd)}

.crumbs{display:flex;gap:2px;padding:8px 10px;overflow-x:auto;white-space:nowrap;border-bottom:1px solid var(--bd);scrollbar-width:none}

dialog{background:var(--p);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:18px;width:min(92vw,420px);margin:auto}

#ed{width:100vw;height:100dvh;max-width:none;border-radius:0;padding:0;margin:0}#ed[open]{display:flex;flex-direction:column}
#ed .h{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--bd)}#ed .h b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ed textarea{flex:1;background:#010409;color:var(--tx);border:0;padding:12px;font:14px/1.5 ui-monospace,monospace;resize:none;outline:0;tab-size:2;white-space:pre}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--p2);border:1px solid var(--bd);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;z-index:99}

#ports{display:none;gap:6px;padding:6px 10px;background:var(--p);border-bottom:1px solid var(--bd);overflow-x:auto;white-space:nowrap;align-items:center}

.stabs button.on{background:var(--bg);color:var(--tx);border-color:var(--bd)}
/* ===== Desktop / janelas ===== */
#toast{z-index:9000}
.ic-s{width:18px;height:18px;flex:none;vertical-align:middle}
.c-folder{color:#e3b341}.c-arc{color:#c586c0}.c-img{color:#4ec9b0}.c-code{color:#569cd6}.c-file{color:#8b949e}
.ic .ic-s{width:22px;height:22px}
.tb button{display:inline-flex;align-items:center;gap:6px}
.in button{display:grid;place-items:center}
.mn{display:grid}

.ti{width:46px;height:46px;border-radius:12px;display:grid;place-items:center}.ti .ic-s{width:24px;height:24px}

.win.act{border-color:#3b4a60;box-shadow:0 18px 50px #000b}
.win.min{display:none}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;border:0}
.wt{display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;height:40px;background:var(--p2);user-select:none;touch-action:none;flex:none}

.wi{display:grid}.wb{display:flex}

.wb .ic-s{width:15px;height:15px}
.wc{flex:1;min-height:0;display:flex;flex-direction:column}
.rz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;z-index:5}
.app{display:flex;flex-direction:column;flex:1;min-height:0;min-width:0}
#store{display:none}
@media(max-width:759px){.win{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;border:0}.wb [data-a=max],.rz{display:none}}
#tb{height:54px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px;background:#0b0f14;border-top:1px solid var(--bd);position:relative;z-index:3000}

#apps{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}

 if(/\.(js|mjs|ts|jsx|tsx|py|sh|json|html|css|md|java|c|cpp|go|rs|php|vue|yml|yaml)$/.test(n))return I('code2','c-code');return I('file','c-file')}
async function load(p=cwd){await run(async()=>{const {items}=await api('/api/list?path='+encodeURIComponent(p));cwd=p;crumbs();
 const L=$('#list');L.innerHTML='';const vis=items.filter(i=>hidden||!i.name.startsWith('.'));

 add('Início','');let acc='';parts.forEach(s=>{const i=document.createElement('i');i.textContent='›';c.append(i);acc=join(acc,s);add(s,acc)});c.scrollLeft=1e5}

 b.push(['Renomear','ren'],['Excluir','del','danger'],['Fechar',null]);
 const a=await dlg(i.name,{buttons:b});const p=join(cwd,i.name);

 else if(a==='ren'){const n=await dlg('Renomear',{input:i.name});if(n&&n!==i.name)run(async()=>{await api('/api/rename',{path:p,name:n});load()})}
 else if(a==='del'){if(await dlg('Excluir?',{text:i.name+(i.dir?' e todo o conteúdo':''),buttons:[['Cancelar',null],['Excluir',1,'danger']]}))run(async()=>{await api('/api/delete',{path:p});load()})}

$('#fi').onchange=e=>{upload([...e.target.files]);e.target.value=''};$('#fiDir').onchange=e=>{upload([...e.target.files]);e.target.value=''};
function upload(fs){const dir=cwd,rp=f=>f._rel||f.webkitRelativePath||f.name,tot=fs.length;fs=fs.filter(f=>!/(^|\/)node_modules\//.test(rp(f)));if(tot>fs.length)toast('node_modules ignorada ('+(tot-fs.length)+' arquivos)');if(!fs.length)return;let i=0;const next=()=>{if(i>=fs.length){toast('Upload concluído');load();return}
 const f=fs[i++],nm=rp(f),x=new XMLHttpRequest();x.open('POST','/api/upload?dir='+encodeURIComponent(dir)+'&name='+encodeURIComponent(nm)+(nm.includes('/')?'&rel=1':''));
 x.upload.onprogress=e=>toast(`${f.name} ${Math.round(e.loaded/e.total*100)}% (${i}/${fs.length})`);
 x.onload=()=>{if(x.status!==200)toast('Falha: '+f.name);next()};x.onerror=()=>{toast('Falha: '+f.name);next()};x.send(f)};next()}
const F=$('#files');['dragenter','dragover'].forEach(v=>F.addEventListener(v,e=>{e.preventDefault();F.classList.add('drag')}));
['dragleave','drop'].forEach(v=>F.addEventListener(v,e=>{e.preventDefault();F.classList.remove('drag')}));
F.addEventListener('drop',async e=>{const its=[...(e.dataTransfer.items||[])].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
 if(!its.length)return upload([...e.dataTransfer.files]);const all=[];
 const walk=async(en,pre)=>{if(en.isFile){const f=await new Promise(r=>en.file(r,()=>r(null)));if(f){f._rel=pre+en.name;all.push(f)}}
  else{const rd=en.createReader();let b;do{b=await new Promise(r=>rd.readEntries(r,()=>r([])));for(const c of b)await walk(c,pre+en.name+'/')}while(b.length)}};

// tabs
function tab(n){openApp(n===1?'files':'term');if(n===2)setTimeout(()=>$('#cmd').focus(),60)}
// terminais
const out=$('#out');const strip=t=>t.replace(/\x1b\][^\x07]*\x07/g,'').replace(/\x1b\[[0-9;?]*[A-Za-z]/g,'').replace(/\r/g,'');
let sess=[],cur=null,es=null;
async function loadSess(){await run(async()=>{sess=(await api('/api/sessions')).list;if(!sess.find(x=>x.id===cur))cur=sess[0].id;tabsUI();connect()})}
function tabsUI(){const c=$('#stabs');c.innerHTML='';sess.forEach((x,i)=>{const b=document.createElement('button');b.textContent=`${i+1} · ${x.name}`;b.className=x.id===cur?'on':'';

<script>
/* ===== Área de trabalho / janelas ===== */
const APPS={
 files:{name:'Arquivos',ic:'folder',col:'#e3b341',el:'#files',w:400,h:540,x:24,y:16},
 term:{name:'Terminal',ic:'terminal',col:'#3fb950',el:'#term',w:620,h:430,x:440,y:70},
 code:{name:'Código',ic:'code',col:'#58a6ff',el:'#code',w:880,h:580,x:70,y:24},

let ST={pin:['files','term','code'],desk:['files','term','code']};
try{Object.assign(ST,JSON.parse(localStorage.getItem('tide')||'{}'))}catch{}
if(!(ST.v>=2)){for(const k of ['pin','desk'])if(!ST[k].includes('git'))ST[k].push('git');ST.v=2}
const saveST=()=>{try{localStorage.setItem('tide',JSON.stringify(ST))}catch{}};

 el.innerHTML=`<div class="wt"><span class="wi" style="color:${a.col}">${I(a.ic)}</span><b>${a.name}</b><span class="wb"><button data-a="min" title="Minimizar">${I('minus')}</button><button data-a="max" title="Maximizar">${I('square')}</button><button data-a="x" title="Fechar">${I('x')}</button></span></div><div class="wc"></div><div class="rz"></div>`;
 const dw=desk.clientWidth,dh=desk.clientHeight,w0=Math.min(a.w,dw-12),h0=Math.min(a.h,dh-12);
 Object.assign(el.style,{width:w0+'px',height:h0+'px',left:Math.max(0,Math.min(a.x+n*28,dw-w0))+'px',top:Math.max(0,Math.min(a.y+n*28,dh-h0))+'px'});
 el.querySelector('.wc').append(document.querySelector(a.el));desk.append(el);
 const w=W[id]={el,id};
 el.addEventListener('pointerdown',()=>focusWin(id),true);
 el.querySelector('.wb').onclick=e=>{const b=e.target.closest('button');if(!b)return;({min:minWin,max:toggleMax,x:closeWin})[b.dataset.a](id)};

 wt.ondblclick=e=>{if(!e.target.closest('button')&&!mob())toggleMax(id)};

 [...new Set([...ST.pin,...Object.keys(W)])].forEach(id=>{const a=APPS[id];if(!a)return;const w=W[id],b=document.createElement('button');
  b.className='tbi'+(w?' run':'')+(w&&focused===id&&!w.el.classList.contains('min')?' act':'');b.title=a.name;

const Ed=(()=>{

const persist=()=>{try{localStorage.setItem('tide-ed',JSON.stringify({root,fs}))}catch{}};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

 py:'and|as|async|await|break|class|continue|def|elif|else|except|False|finally|for|from|if|import|in|is|lambda|None|not|or|pass|raise|return|self|True|try|while|with|yield',

const mk=(c,s,k)=>new RegExp(`(${c})|(${s})|(${NU})|(\\b(?:${k})\\b)`,'g');
const RX={js:mk(/\/\/.*/.source+'|'+BC,S1+'|'+BT,KW.js),py:mk('#.*',TQ+'|'+S1,KW.py),sh:mk('#.*',S1,KW.sh),
 css:new RegExp(`(${BC})|(${S1})|(#[0-9a-fA-F]{3,8}\\b|\\b\\d+(?:\\.\\d+)?(?:px|r?em|%|vh|vw|ms|s|deg)?)|(@[\\w-]+|[\\w-]+(?=\\s*:))`,'g')};

  for(const m of code.matchAll(/(<!--[\s\S]*?-->)|(<\/?[a-zA-Z][^>]*>)/g)){out+=esc(code.slice(last,m.index));last=m.index+m[0].length;
   out+=m[1]?`<span class="c">${esc(m[1])}</span>`:esc(m[2]).replace(/("[^"]*"|'[^']*')/g,'<span class="s">$1</span>').replace(/^(&lt;\/?[\w:-]+)/,'<span class="k">$1</span>')}

  out+=esc(code.slice(last,m.index));last=m.index+m[0].length;
  let g=1;while(g<5&&m[g]===undefined)g++;

function paint(){raf=0;const t=ta.value;hl.innerHTML=hi(t,cur?lang(cur.name):'txt')+'\n';

 const w=c.getBoundingClientRect().width/50;c.remove();if(w>0)cw=w}

 const x=gw+8+col*cw,y=ln*20+8,vw=sc.clientWidth,vh=sc.clientHeight;

/* abas */
function renderTabs(){const T=$('#eTabs');T.innerHTML='';
 tabs.forEach(t=>{const e=document.createElement('div');e.className='et'+(t===cur?' on':'');
  e.innerHTML=`<span style="display:grid">${icon({name:t.name})}</span><span></span><button class="x">${t.text!==t.saved?'<span class="dot"></span>':I('x')}</button>`;

 cur=t;ta.value=t.text;ta.setSelectionRange(t.sel||0,t.sel||0);welcome();paint();renderTabs();stat();

 const d=dirOf(t.path);if(root===''||d===root||d.startsWith(root+'/')){sel=d;}

async function openFile(p){

 try{const r=await fetch('/api/write?path='+encodeURIComponent(t.path),{method:'POST',body:v});if(!r.ok)throw new Error((await r.json()).error||'Erro ao salvar');
  t.saved=v;t.text=v;renderTabs();stat();toast('Salvo');document.dispatchEvent(new Event('tide-fs'))}catch(e){toast(e.message)}}

const dirty=()=>tabs.some(t=>t.text!==t.saved);
addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue=''}});

/* explorador */

 let items;try{items=(await api('/api/list?path='+encodeURIComponent(path))).items}catch(e){toast(e.message);return}

/* edição */
function ins(t){ta.focus({preventScroll:true});if(!document.execCommand('insertText',false,t)){ta.setRangeText(t,ta.selectionStart,ta.selectionEnd,'end');ta.dispatchEvent(new Event('input'))}}
function rep(a,b,t,s,e){ta.focus({preventScroll:true});ta.setSelectionRange(a,b);ins(t);ta.setSelectionRange(s,e)}
function indent(back){const v=ta.value,s=ta.selectionStart,e=ta.selectionEnd;if(s===e&&!back){ins('  ');return}
 const a=v.lastIndexOf('\n',s-1)+1;let b=v.indexOf('\n',e);if(b<0)b=v.length;
 const L=v.slice(a,b).split('\n'),nl=L.map(x=>back?x.replace(/^( {1,2}|\t)/,''):'  '+x).join('\n');
 if(s===e){const c=Math.max(a,s-(b-a-nl.length));rep(a,b,nl,c,c)}else rep(a,b,nl,a,a+nl.length)}
function comment(){if(!cur)return;const pre={js:'// ',py:'# ',sh:'# '}[lang(cur.name)];if(!pre)return;
 const v=ta.value,a=v.lastIndexOf('\n',ta.selectionStart-1)+1;let b=v.indexOf('\n',ta.selectionEnd);if(b<0)b=v.length;
 const m=pre.trim(),L=v.slice(a,b).split('\n'),all=L.every(x=>!x.trim()||x.trimStart().startsWith(m));

ta.addEventListener('beforeinput',e=>{
 if(e.isComposing||!e.cancelable||!cur)return;const v=ta.value,s=ta.selectionStart,en=ta.selectionEnd,t=e.inputType;

  const ls=v.lastIndexOf('\n',s-1)+1,ind=v.slice(ls,s).match(/^\s*/)[0],pb=v[s-1],cl={'{':'}','(':')','[':']'}[pb];
  const extra=(cl||(pb===':'&&lang(cur.name)==='py'))?'  ':'',t1='\n'+ind+extra;
  if(cl&&v[en]===cl){ins(t1+'\n'+ind);ta.setSelectionRange(s+t1.length,s+t1.length)}else ins(t1);reveal();return}
 if(t==='insertText'&&e.data&&e.data.length===1){const ch=e.data,nx=v[en],pr={'(':')','[':']','{':'}','"':'"',"'":"'",'`':'`'};
  if(')]}"\'`'.includes(ch)&&nx===ch&&s===en){e.preventDefault();ta.setSelectionRange(s+1,s+1);return}
  if(pr[ch]){if(s!==en){e.preventDefault();ins(ch+v.slice(s,en)+pr[ch]);ta.setSelectionRange(s+1,en+1);return}
   if((!nx||/[\s)\]}.,;:]/.test(nx))&&!(/["'`]/.test(ch)&&/\w/.test(v[s-1]||''))){e.preventDefault();ins(ch+pr[ch]);ta.setSelectionRange(s+1,s+1)}}return}
 if(t==='deleteContentBackward'&&s===en&&s>0){const o=v[s-1],c=v[s];if(({'(':')','[':']','{':'}','"':'"',"'":"'",'`':'`'})[o]===c){e.preventDefault();ta.setSelectionRange(s-1,s+1);document.execCommand('delete')}}});

 const p=r[k];ta.setSelectionRange(p,p+ff.value.length);const b=ta.value.slice(0,p),ln=b.split('\n').length-1,col=p-b.lastIndexOf('\n')-1;

/* integração IA (ai.js): contexto do editor e aplicação das mudanças feitas em disco pelo agente */
function ctx(){return{root,active:cur?cur.path:'',dirty:tabs.filter(t=>t.text!==t.saved).map(t=>t.path)}}
async function sync(changes){
 const hit=(t,p)=>t.path===p||t.path.startsWith(p+'/'),reload=new Set();
 for(const c of changes){
  if(c.op==='rename'){tabs.forEach(t=>{if(hit(t,c.from)){t.path=c.to+t.path.slice(c.from.length);t.name=t.path.split('/').pop()}});if(exp.delete(c.from))exp.add(c.to);if(sel===c.from)sel=c.to}
  else if(c.op==='delete'){const gone=tabs.filter(t=>hit(t,c.path)&&t.text===t.saved);
   if(gone.length){const had=cur&&gone.includes(cur);tabs=tabs.filter(t=>!gone.includes(t));
    if(had){cur=null;if(tabs.length)activate(tabs[0]);else{ta.value='';paint();welcome();stat()}}}
   exp.delete(c.path);if(sel===c.path)sel=root}
  else if(c.op==='write'&&tabs.some(t=>t.path===c.path))reload.add(c.path)}
 for(const p of reload){const t=tabs.find(x=>x.path===p);if(!t)continue;
  if(t.text!==t.saved){toast(t.name+' foi alterado pela IA, mas você tem edições não salvas aqui');continue}
  try{const {text}=await api('/api/read?path='+encodeURIComponent(p));if(text===t.text)continue;t.text=t.saved=text;
   if(t===cur){const s=Math.min(ta.selectionStart,text.length);ta.value=text;ta.setSelectionRange(s,s);paint();stat()}}catch{}}
 renderTabs();stat();tree();document.dispatchEvent(new Event('tide-fs'))} // tide-fs: atualiza o app Git
return{openFile,openFolder,dirty,layout,pick,ctx,sync}})();

/* ===== Git / GitHub ===== */
const Git=(()=>{
let repo='',has=false,info=null,msg='',out='',busy=false,tm=0;
try{const s=localStorage.getItem('tide-git');if(s!==null){repo=s;has=true}}catch{}
const body=$('#gBody'),enc=encodeURIComponent;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const btn=(l,f,c='gbt',ic)=>{const b=el('button',c);if(ic)b.innerHTML=I(ic);b.append(l);b.onclick=f;b.disabled=busy;return b};
const card=(t,...k)=>{const c=el('div','gc');if(t)c.append(el('h4','',t));c.append(...k);body.append(c);return c};
const full=f=>repo?repo+'/'+f:f;
const saveRepo=()=>{try{localStorage.setItem('tide-git',repo)}catch{}};
const kind=xy=>{if(xy==='??')return['Novo','n'];if(/^(DD|AU|UD|UA|DU|AA|UU)$/.test(xy))return['Conflito','c'];
 const x=xy[0]!==' '?xy[0]:xy[1];return({M:['Modificado','m'],A:['Novo','n'],D:['Apagado','d'],R:['Renomeado','r'],C:['Novo','n']})[x]||['Alterado','m']};

async function refresh(){
 if(!has){render();return}
 try{const r=await api('/api/git/info?path='+enc(repo));info=r;if(r.repo&&r.path!==repo){repo=r.path;saveRepo()}}catch(e){info={error:e.message}}
 render()}
async function call(op,extra={}){
 try{const r=await api('/api/git/run',{path:repo,op,...extra});out=r.out||'';if(r.missing)info={missing:true};return r}
 catch(e){out=e.message;return{ok:false}}}
async function act(op,extra,okMsg){
 if(busy)return false;busy=true;render();const r=await call(op,extra);busy=false;
 toast(r.ok?(okMsg||'Concluído'):'Falhou — veja a saída abaixo');if(r.ok&&op==='commit')msg='';await refresh();return r.ok}
async function sendAll(){
 if(busy)return;const n=info.files.length;if(n&&!msg.trim())return toast('Escreva a mensagem do commit');
 busy=true;render();let ok=true;
 if(n){ok=(await call('commit',{message:msg})).ok;if(ok)msg='';else toast('Commit falhou — veja a saída')}
 if(ok){ok=(await call('push')).ok;toast(ok?'Enviado ao GitHub':'Push falhou — veja a saída')}
 busy=false;await refresh()}

function render(){
 $('#gRepo').textContent=has?(repo?repo.split('/').pop():'Início'):'Git';
 const br=$('#gBr');br.textContent=info&&info.branch||'';br.style.display=info&&info.branch?'':'none';
 body.innerHTML='';
 if(!has)return card('Git e GitHub',el('p','','Clone um repositório do GitHub, edite no editor, apague ou adicione arquivos e pastas e envie tudo de volta com commit e push.'),
   (()=>{const r=el('div','grow');r.append(btn('Clonar do GitHub',clone,'gbt pri','download'),btn('Abrir repositório',choose,'gbt','folder'),btn('Conta GitHub',account,'gbt','user'));return r})());
 if(!info)return card('',el('p','','Carregando…'));
 if(info.missing)return card('Git não instalado',el('p','','No Termux, rode: pkg install git'));
 if(info.error)return card('Erro',el('p','',info.error));
 if(info.repo===false)return card('Esta pasta não é um repositório',el('p','','Você pode iniciar um repositório aqui e depois conectar a um repositório do GitHub (botão Remoto).'),btn('Iniciar repositório aqui',()=>act('init',{},'Repositório criado'),'gbt pri','git'));
 // repositório
 const rem=info.remote?info.remote.replace(/^https:\/\//,''):'sem remoto';
 const r1=el('div','grow');
 if(info.ahead)r1.append(el('span','gchipx','↑ '+info.ahead+' a enviar'));if(info.behind)r1.append(el('span','gchipx','↓ '+info.behind+' a baixar'));
 const sel=el('select','gsel');info.branches.forEach(b=>{const o=el('option','',b);o.value=b;sel.append(o)});sel.value=info.branch;sel.disabled=busy||!info.branches.length;
 sel.onchange=()=>act('checkout',{branch:sel.value},'Branch alterada');
 const r2=el('div','grow');r2.append(sel,btn('Nova branch',newBranch,'gbt'),btn('Remoto',remote,'gbt'));
 const r3=el('div','grow');r3.append(btn('Pull',()=>act('pull',{},'Atualizado'),'gbt','arrow-down'),btn('Push',()=>act('push',{},'Enviado ao GitHub'),'gbt','arrow-up'),btn('Abrir no editor',()=>Ed.openFolder(repo),'gbt','code'));
 card('Repositório',el('p','',rem),...(r1.children.length?[r1]:[]),r2,r3);
 // alterações
 const c=card('Alterações ('+info.files.length+')');
 if(!info.files.length)c.append(el('p','','Nenhuma alteração. Edite, apague ou envie arquivos/pastas para o repositório e elas aparecem aqui.'));
 info.files.slice(0,200).forEach(f=>{const [lb,cl]=kind(f.xy),row=el('div','gf'),dir=f.path.endsWith('/');
  row.append(el('span','gs '+cl,lb),el('span','p',f.path));const m=el('button','gx');m.innerHTML=I('dots');row.append(m);
  const items=[];if(cl!=='d')items.push([dir?'Ver pasta no editor':'Abrir no editor',()=>dir?Ed.openFolder(full(f.path.slice(0,-1))):Ed.openFile(full(f.path))]);
  items.push(['Descartar alterações',async()=>{if(await dlg('Descartar alterações?',{text:f.path+(cl==='n'?' será apagado.':' voltará ao último commit.'),buttons:[['Cancelar',null],['Descartar',1,'danger']]}))act('discard',{file:f.path,xy:f.xy},'Descartado')}]);
  m.onclick=e=>{e.stopPropagation();const b=m.getBoundingClientRect();ctxMenu(b.left-190,b.bottom,items)};
  row.onclick=()=>{if(cl!=='d')items[0][1]()};c.append(row)});
 if(info.files.length>200)c.append(el('p','','… e mais '+(info.files.length-200)+' itens'));
 const inp=el('input','gin');inp.placeholder='Mensagem do commit';inp.value=msg;inp.oninput=()=>msg=inp.value;inp.disabled=busy;
 inp.onkeydown=e=>{if(e.key==='Enter')sendAll()};
 const r4=el('div','grow');r4.append(btn(busy?'Trabalhando…':'Commit e enviar',sendAll,'gbt pri','arrow-up'),
   btn('Só commit',()=>{if(!msg.trim())return toast('Escreva a mensagem do commit');act('commit',{message:msg},'Commit criado')},'gbt','check'));
 if(info.files.length||info.ahead)card('Enviar ao GitHub',inp,r4);
 if(out){const pre=el('pre','gout',out);card('Saída do Git',pre)}
 if(info.log.length){const h=card('Histórico');info.log.forEach(l=>{const r=el('div','gl');r.append(el('code','',l.h));const s=el('span','',l.s);s.append(el('small','','  '+l.a+' · '+l.t));r.append(s);h.append(r)})}}

async function choose(){const p=await Ed.pick(repo,'Usar esta pasta','Escolher repositório');if(p!==null)open(p)}
function open(p){repo=p;has=true;info=null;out='';saveRepo();openApp('git');render();refresh()}
async function newBranch(){const n=await dlg('Nova branch',{input:''});if(n)act('checkout',{branch:n,create:true},'Branch criada')}
async function remote(){const u=await dlg('Remoto (origin)',{text:'URL do repositório no GitHub',input:info.remote||'https://github.com/usuario/repo.git'});if(u)act('remote',{url:u},'Remoto salvo')}
async function clone(){
 const url=await dlg('Clonar repositório',{text:'Cole a URL do GitHub (https://github.com/usuario/repo.git). Para repositórios privados, configure a Conta antes.',input:''});if(!url)return;
 const dir=await Ed.pick('','Clonar aqui','Escolher pasta de destino');if(dir===null)return;
 busy=true;has=false;render();body.append(el('p','gm','Clonando… pode demorar um pouco.'));
 try{const r=await api('/api/git/clone',{url,dir});repo=r.path;has=true;out='';saveRepo();toast('Repositório clonado');Ed.openFolder(r.path)}
 catch(e){out=e.message;toast('Falha ao clonar');has=false}
 busy=false;info=null;await refresh();if(!has){render();if(out)card('Erro ao clonar',el('pre','gout',out))}}
async function account(){
 let c={};try{c=await api('/api/git/config')}catch{}
 const d=document.createElement('dialog');document.body.append(d);
 d.innerHTML='<h3>Conta GitHub</h3><p>Token: GitHub → Settings → Developer settings → Personal access tokens (permissão "repo", ou Contents: leitura e escrita). Fica salvo só neste aparelho.</p>';
 const f=[['Nome','name',c.name],['E-mail','email',c.email],['Usuário do GitHub','user',c.user],['Token de acesso','token','']].map(([l,k,v])=>{
  const i=el('input');i.placeholder=l+(k==='token'&&c.token?' (já salvo — vazio mantém)':'');i.value=v||'';i.autocomplete='off';i.autocapitalize='off';if(k==='token')i.type='password';d.append(i);return[k,i]});
 const B=el('div','btns'),x=()=>{d.close();d.remove()};
 const b1=el('button','','Cancelar'),b2=el('button','','Salvar');b1.onclick=x;
 b2.onclick=async()=>{const o={};f.forEach(([k,i])=>{if(i.value.trim())o[k]=i.value.trim()});
  if(o.token&&!o.user)return toast('Informe o usuário do GitHub');
  try{await api('/api/git/config',o);toast('Conta salva');x();refresh()}catch(e){toast(e.message)}};
 B.append(b1,b2);d.append(B);d.showModal()}

$('#gOpen').onclick=choose;$('#gClone').onclick=clone;$('#gAcc').onclick=account;$('#gRef').onclick=refresh;
document.addEventListener('tide-fs',()=>{clearTimeout(tm);tm=setTimeout(()=>{if(W.git&&has)refresh()},700)});
render();
return{open,refresh}})();
