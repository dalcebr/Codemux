<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>Codemux</title>
<script>(function(){try{var c=JSON.parse(localStorage.getItem("cmx-cfg")||"{}"),t=c.theme||"system",u=(location.search.match(/[?&]ui=(classic|shell)/)||[])[1]||c.ui||"shell";if(u!==c.ui){c.ui=u;localStorage.setItem("cmx-cfg",JSON.stringify(c))}if(t==="system")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t;document.documentElement.dataset.ui=u}catch(e){document.documentElement.dataset.ui="shell"}})()</script>
<link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/ui.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/shell.css"><link rel="stylesheet" href="css/ai.css">
</head><body>
<div id="desk"><div id="icons"></div></div>
<div id="tb"><button id="start" title="Programas"><i data-i="grid"></i></button><div id="apps"></div><div id="ports"></div><span id="clk"></span></div>
<div id="launcher"></div>
<div id="store">
<section class="app" id="files" aria-label="Arquivos"></section>

<section class="app" id="git"><div class="gh"><div class="gt"><b id="gRepo">Git</b><span class="gchip" id="gBr"></span></div>
<div class="gb"><button id="gOpen" title="Escolher repositório"><i data-i="folder"></i></button><button id="gClone" title="Clonar do GitHub"><i data-i="download"></i></button><button id="gAcc" title="Conta GitHub"><i data-i="user"></i></button><button id="gRef" title="Atualizar"><i data-i="refresh"></i></button></div></div>
<div id="gBody"></div></section>
<section class="app" id="code"><div class="ed">
  <div class="ab"><button id="eEx" title="Explorador"><i data-i="files"></i></button></div>
  <div class="sb" id="eSb">
    <div class="sbh"><span id="eRoot">EXPLORADOR</span><div><button id="eNF" title="Novo arquivo"><i data-i="file-plus"></i></button><button id="eND" title="Nova pasta"><i data-i="folder-plus"></i></button><button id="eRf" title="Atualizar"><i data-i="refresh"></i></button></div></div>
    <div id="eTree"></div>
    <div class="sbf"><button id="eOpen"><i data-i="folder"></i>Abrir pasta</button></div>
  </div>
  <div class="em">
    <div class="etb"><button id="eFl" class="ehb" title="Arquivos" aria-label="Mostrar arquivos"><i data-i="files"></i></button><button id="eCur" class="ecur" title="Arquivos abertos" aria-label="Arquivos abertos"><span class="cn"></span><span class="cc"></span><i data-i="chev-d"></i></button><div class="etabs" id="eTabs" role="tablist"></div>
      <div class="eact"><button id="eUn" title="Desfazer"><i data-i="undo"></i></button><button id="eRe" title="Refazer"><i data-i="redo"></i></button><button id="eFd" title="Buscar (Ctrl+F)"><i data-i="search"></i></button><button id="eSv" title="Salvar (Ctrl+S)"><i data-i="save"></i></button><button id="eFm">A−</button><button id="eFp">A+</button><button id="eMore" title="Mais ações" aria-label="Mais ações do editor"><i data-i="dots"></i></button></div></div>
    <div class="fbar" id="fBar"><input id="fFind" placeholder="Buscar" autocomplete="off" autocapitalize="off" spellcheck="false"><input id="fRep" placeholder="Substituir" autocomplete="off" autocapitalize="off" spellcheck="false"><span id="fCnt">0</span><button id="fPrev"><i data-i="chev-up"></i></button><button id="fNext"><i data-i="chev-down"></i></button><button class="tx" id="fR1">Substituir</button><button class="tx" id="fRA">Todos</button><button id="fX"><i data-i="x"></i></button></div>
    <div class="ewrap">
      <div class="sc" id="eSc"><div class="erow"><div class="gut" id="eGut">1</div><div class="inner"><pre id="eHl"></pre><textarea id="eTa" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" wrap="off" disabled></textarea><div id="fm"></div></div></div></div>
      <div class="welcome on" id="eWel"><i data-i="code" class="big"></i><div>Nenhum arquivo aberto</div><button id="wOpen"><i data-i="folder"></i>Abrir pasta</button><button id="wNew" style="background:#3c3c3c"><i data-i="file-plus"></i>Novo arquivo</button></div>
    </div>
    <div class="xk" id="eXk"></div>
    <div class="stat"><span id="sPos">Ln 1, Col 1</span><span id="sInfo"></span></div>
  </div>
</div></section>
</div>

<dialog id="ed"><div class="h"><b id="edn"></b><div class="btns"><button id="edS" style="background:var(--ac);color:#04121f;border:0;padding:8px 14px;border-radius:9px;font-weight:600">Salvar</button><button id="edC">Fechar</button></div></div><textarea id="edt" spellcheck="false"></textarea></dialog>
